<div class="field">
  <label for="cena">Cena maksymalna</label>
  <div class="row">
    <input type="range" id="cena" min="0" max="1000" step="50" value="300" aria-valuetext="300 zł">
    <span id="cena-tekst" class="value">300 zł</span>
  </div>
</div>

<script>
  const slider = document.getElementById("cena");
  slider.addEventListener("input", () => {
    const text = `${slider.value} zł`;
    slider.setAttribute("aria-valuetext", text);
    document.getElementById("cena-tekst").textContent = text;
  });
</script>

<style>
  .field { max-width: 28rem; }
  label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
  .row { display: flex; align-items: center; gap: 1rem; }
  input[type="range"] { flex: 1; height: 44px; margin: 0; accent-color: #14171a; cursor: pointer; }
  .value { min-width: 5rem; font-family: ui-monospace, Consolas, monospace; font-weight: 700; }
</style>
