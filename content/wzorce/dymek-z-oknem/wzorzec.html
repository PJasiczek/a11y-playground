<div class="stage">
  <label for="kod">Kod CVC</label>
  <div class="row">
    <input id="kod" inputmode="numeric" autocomplete="cc-csc" size="4">
    <button type="button" id="cvc-przycisk" popovertarget="cvc">Co to jest CVC?</button>
  </div>
  <div popover id="cvc" role="dialog" aria-label="CVC" aria-describedby="cvc-opis" tabindex="-1">
    <p id="cvc-opis">Trzy cyfry na odwrocie karty, obok podpisu. Nie podawaj ich nikomu przez telefon.</p>
  </div>
</div>

<script>
  const popover = document.getElementById("cvc");
  // The browser opens and closes the popover; moving focus into it is the one thing left to do.
  popover.addEventListener("toggle", (event) => {
    if (event.newState === "open") popover.focus();
  });
</script>

<style>
  .stage { min-height: 13rem; }
  label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
  .row { display: flex; gap: 0.5rem; align-items: center; }
  input { width: 6rem; min-height: 44px; padding: 0 0.5rem; border: 1px solid #857f72; border-radius: 4px; font: inherit; }
  #cvc-przycisk { min-height: 44px; padding: 0 0.9rem; border: 2px solid #14171a; border-radius: 4px; background: #fff; color: #14171a; font: inherit; font-weight: 600; cursor: pointer; anchor-name: --cvc; }
  /* Below the button, so it covers neither the button nor the field. */
  #cvc { position-anchor: --cvc; inset: auto; top: anchor(bottom); left: anchor(left); margin: 0.5rem 0 0; width: min(18rem, 80vw); padding: 0.75rem 1rem; border: 2px solid #14171a; border-radius: 6px; background: #fff; color: #14171a; }
  #cvc p { margin: 0; }
</style>
