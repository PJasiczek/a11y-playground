<div class="tip">
  <button type="button" id="kopiuj" aria-label="Kopiuj link" aria-describedby="kopiuj-opis">
    <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 20 20">
      <path d="M7 3h9v11H7zM4 6v11h9" fill="none" stroke="currentColor" stroke-width="2" />
    </svg>
  </button>
  <div role="tooltip" id="kopiuj-opis">Kopiuje adres tej strony do schowka</div>
</div>
<p role="status" id="kopiowanie" class="status"></p>

<script>
  const tip = document.querySelector(".tip");
  const button = document.getElementById("kopiuj");
  // Esc hides the tooltip without moving focus (1.4.13). It shows again on the next hover or focus.
  button.addEventListener("keydown", (event) => {
    if (event.key === "Escape") tip.dataset.dismissed = "";
  });
  for (const type of ["blur", "pointerleave"]) tip.addEventListener(type, () => delete tip.dataset.dismissed, true);
  button.addEventListener("click", () => {
    document.getElementById("kopiowanie").textContent = "Skopiowano link.";
  });
</script>

<style>
  .tip { position: relative; display: inline-flex; align-items: center; }
  #kopiuj { display: grid; place-items: center; width: 44px; height: 44px; border: 2px solid #14171a; border-radius: 4px; background: #fff; color: #14171a; cursor: pointer; }
  /* Beside the button, not over the next control (2.4.11). The gap is bridged, so the pointer can reach it. */
  [role="tooltip"] { display: none; position: absolute; left: 100%; margin-left: 0.5rem; padding: 0.35rem 0.6rem; border-radius: 4px; background: #14171a; color: #fff; white-space: nowrap; }
  [role="tooltip"]::before { content: ""; position: absolute; right: 100%; top: 0; width: 0.5rem; height: 100%; }
  .tip:not([data-dismissed]):hover [role="tooltip"],
  .tip:not([data-dismissed]):has(:focus-visible) [role="tooltip"] { display: block; }
  .status { min-height: 1.5rem; margin: 0.5rem 0 0; }
</style>
