<ul role="tree" aria-label="Pliki" class="tree">
  <li role="treeitem" id="drzewo-dokumenty" aria-expanded="false" aria-labelledby="etykieta-dokumenty" tabindex="0">
    <span id="etykieta-dokumenty">Dokumenty</span>
    <ul role="group" hidden>
      <li role="treeitem" id="drzewo-umowa" tabindex="-1"><span>umowa.pdf</span></li>
      <li role="treeitem" tabindex="-1"><span>faktura.pdf</span></li>
    </ul>
  </li>
  <li role="treeitem" id="drzewo-zdjecia" aria-expanded="false" aria-labelledby="etykieta-zdjecia" tabindex="-1">
    <span id="etykieta-zdjecia">Zdjęcia</span>
    <ul role="group" hidden>
      <li role="treeitem" tabindex="-1"><span>wakacje.jpg</span></li>
    </ul>
  </li>
</ul>

<script>
  const tree = document.querySelector('[role="tree"]');
  const groupOf = (item) => item.querySelector(':scope > [role="group"]');
  const parentOf = (item) => item.parentElement.closest('[role="treeitem"]');
  // Items a reader can reach: those not inside a closed branch.
  const visible = () => [...tree.querySelectorAll('[role="treeitem"]')].filter((item) => !item.parentElement.closest("[hidden]"));
  const focus = (item) => {
    for (const other of tree.querySelectorAll('[role="treeitem"]')) other.tabIndex = other === item ? 0 : -1;
    item.focus();
  };
  const setOpen = (item, open) => {
    item.setAttribute("aria-expanded", String(open));
    groupOf(item).hidden = !open;
  };

  tree.addEventListener("keydown", (event) => {
    const item = event.target.closest('[role="treeitem"]');
    if (!item) return;
    const items = visible();
    const at = items.indexOf(item);
    const branch = item.hasAttribute("aria-expanded");
    const open = item.getAttribute("aria-expanded") === "true";
    const moves = {
      ArrowDown: () => items[at + 1] && focus(items[at + 1]),
      ArrowUp: () => items[at - 1] && focus(items[at - 1]),
      Home: () => focus(items[0]),
      End: () => focus(items[items.length - 1]),
      ArrowRight: () => (branch && !open ? setOpen(item, true) : branch && focus(groupOf(item).querySelector('[role="treeitem"]'))),
      ArrowLeft: () => (branch && open ? setOpen(item, false) : parentOf(item) && focus(parentOf(item))),
    };
    if (!moves[event.key]) return;
    event.preventDefault();
    moves[event.key]();
  });
  tree.addEventListener("click", (event) => {
    const item = event.target.closest('[role="treeitem"]');
    if (!item) return;
    if (item.hasAttribute("aria-expanded")) setOpen(item, item.getAttribute("aria-expanded") !== "true");
    focus(item);
  });
</script>

<style>
  .tree, .tree ul { margin: 0; padding: 0; list-style: none; }
  .tree { max-width: 20rem; padding: 0.25rem 0; border: 1px solid #857f72; border-radius: 4px; background: #fff; }
  .tree ul { padding-left: 1.5rem; }
  .tree li > span { display: flex; align-items: center; gap: 0.4rem; min-height: 44px; padding: 0 0.6rem; cursor: pointer; }
  [aria-expanded] > span::before { content: "▸" / ""; width: 1rem; font-family: ui-monospace, Consolas, monospace; }
  [aria-expanded="true"] > span::before { content: "▾" / ""; }
  /* The focused item outlines its own row, not the whole branch under it. */
  .tree li:focus-visible { outline: none; }
  .tree li:focus-visible > span { outline: 3px solid #2c36a8; outline-offset: -3px; }
</style>
