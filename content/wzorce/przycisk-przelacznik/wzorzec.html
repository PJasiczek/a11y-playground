<button type="button" class="toggle" id="wycisz" aria-pressed="false">
  <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 20 20">
    <path d="M3 7h4l5-4v14l-5-4H3z" fill="currentColor" />
  </svg>
  Wycisz
</button>

<script>
  const toggle = document.getElementById("wycisz");
  toggle.addEventListener("click", () => {
    toggle.setAttribute("aria-pressed", String(toggle.getAttribute("aria-pressed") !== "true"));
  });
</script>

<style>
  .toggle { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 44px; padding: 0 1rem; border: 2px solid #14171a; border-radius: 4px; background: #fff; color: #14171a; font: inherit; font-weight: 600; cursor: pointer; }
  /* Pressed: filled, with a tick. Not colour alone. */
  .toggle[aria-pressed="true"] { background: #14171a; color: #fff; }

  @media (forced-colors: active) { .toggle[aria-pressed="true"] { border-width: 4px; } }
</style>
