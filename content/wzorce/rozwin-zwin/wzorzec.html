<button type="button" class="toggle" id="szczegoly-przycisk" aria-expanded="false" aria-controls="szczegoly">Szczegóły zamówienia</button>
<div id="szczegoly" class="panel" hidden>
  <p>Zamówienie nr 4821: 3 produkty, 147 zł. Wysłane 2 października.</p>
  <a href="#szczegoly">Śledź przesyłkę</a>
</div>

<script>
  const button = document.getElementById("szczegoly-przycisk");
  const panel = document.getElementById("szczegoly");
  button.addEventListener("click", () => {
    const open = button.getAttribute("aria-expanded") === "true";
    button.setAttribute("aria-expanded", String(!open));
    panel.hidden = open;
  });
</script>

<style>
  .toggle { display: flex; justify-content: space-between; align-items: center; gap: 1rem; width: 100%; max-width: 28rem; min-height: 48px; padding: 0 0.75rem; border: 1px solid #857f72; border-radius: 4px; background: #fff; color: #14171a; font: inherit; font-weight: 600; text-align: left; cursor: pointer; }
  .toggle::after { content: "+" / ""; font: 700 1.25rem ui-monospace, Consolas, monospace; }
  .toggle[aria-expanded="true"]::after { content: "−" / ""; }
  .panel { max-width: 28rem; padding: 0.25rem 0.75rem 0.75rem; }
  .panel a { display: inline-flex; align-items: center; min-height: 44px; color: #2c36a8; }
</style>
