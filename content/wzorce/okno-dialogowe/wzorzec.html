<div class="stage">
  <p class="address">Adres dostawy: ul. Długa 5, Kraków</p>
  <button type="button" id="otworz">Zmień adres</button>
</div>

<dialog id="adres" aria-labelledby="adres-tytul">
  <h2 id="adres-tytul">Adres dostawy</h2>
  <form method="dialog">
    <label for="ulica">Ulica</label>
    <input id="ulica" autocomplete="address-line1">
    <div class="actions">
      <button value="zapisz">Zapisz</button>
      <button value="anuluj" formnovalidate>Anuluj</button>
    </div>
  </form>
</dialog>

<script>
  const dialog = document.getElementById("adres");
  document.getElementById("otworz").addEventListener("click", () => dialog.showModal());
</script>

<style>
  /* The modal sits in the top layer, outside the page's height, so the stage leaves room for it. */
  .stage { min-height: 20rem; }
  .address { margin: 0 0 0.5rem; }
  button { min-height: 44px; padding: 0 1rem; border: 2px solid #14171a; border-radius: 4px; background: #fff; color: #14171a; font: inherit; font-weight: 600; cursor: pointer; }
  dialog { width: min(24rem, 90vw); padding: 1.25rem; border: 2px solid #14171a; border-radius: 6px; }
  dialog::backdrop { background: rgb(20 23 26 / 0.5); }
  dialog h2 { margin: 0 0 0.75rem; font-size: 1.25rem; }
  label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
  input { width: 100%; min-height: 44px; padding: 0 0.5rem; border: 1px solid #857f72; border-radius: 4px; font: inherit; }
  .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .actions button[value="zapisz"] { background: #14171a; color: #fff; }
</style>
