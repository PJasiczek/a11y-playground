- id: wersje-jezykowe
  prompt: Urząd ma stronę po polsku i po angielsku. Ile deklaracji dostępności potrzebuje?
  options:
    - text: Dwie, po jednej na każdą wersję językową
      correct: true
      why: Art. 10 wymaga własnej deklaracji dla każdej wersji językowej.
    - text: Jedną, wspólną
      why: Każda wersja językowa ma mieć swoją.
    - text: Żadnej, jeśli strona jest w pełni dostępna
      why: Deklaracja jest obowiązkowa zawsze.
- id: zawartosc
  prompt: Co musi znaleźć się w deklaracji?
  options:
    - text: Lista elementów, które nie są dostępne, z powodem
      correct: true
      why: Deklaracja mówi też o brakach.
    - text: Kontakt do osoby odpowiedzialnej
      correct: true
      why: Pod ten kontakt trafiają żądania i pytania.
    - text: Data ostatniej aktualizacji
      correct: true
      why: Pokazuje, czy deklaracja jest aktualna.
    - text: Wynik testu Lighthouse w procentach
      why: Ustawa tego nie wymaga, a wynik automatu nie mówi o zgodności.
- id: kara
  prompt: Jaka kara grozi za brak deklaracji dostępności?
  options:
    - text: Do 5000 zł
      correct: true
      why: Tak mówi art. 19.
    - text: Do 10 000 zł
      why: Tyle grozi za uporczywe niezapewnianie dostępności.
    - text: Żadna, deklaracja jest dobrowolna
      why: Deklaracja jest obowiązkowa, a za jej brak grozi kara.
